{% load static %}
<section id="about" class="min-h-screen py-16 bg-navy-900">
  <div class="max-w-6xl mx-auto px-6 fade-up">
    <h2 class="text-center text-4xl md:text-5xl font-serif text-gold-400 mb-8">About Us</h2>

    <!-- Bio split -->
    <div class="mt-8 grid items-center gap-8 md:grid-cols-2">
      <div class="text-center md:text-left">
        <p class="text-gray-300 leading-relaxed">
          {{ about.first_paragraph }}
        </p>
        <p class="mt-4 text-gray-300 leading-relaxed">
          {{ about.second_paragraph }}
        </p>
        <div class="mt-6 flex justify-center md:justify-start">
          <a
            href="#_contact"
            class="inline-block bg-gold-400 text-navy-900 font-semibold px-6 py-3 rounded-lg shadow-gold transition-all hover:bg-gold-500 hover:shadow-lg"
          >
            Learn More
          </a>
        </div>
      </div>

      <div class="relative">
        <div class="overflow-hidden rounded-2xl border border-gold-400/20 shadow-lg">
          <img
            src="{% static 'images/aboutus.avif' %}"
            alt="Seabound team and vessels"
            class="w-full h-56 md:h-72 object-cover transform transition-transform duration-700 hover:scale-105 will-change-transform"
            style="transform-origin: center;"
          />
        </div>
        <div class="pointer-events-none absolute inset-0 rounded-2xl ring-1 ring-inset ring-white/5"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="mt-12 grid gap-4 sm:grid-cols-3 text-center">
      <div class="rounded-2xl bg-navy-800 border border-gold-400/20 p-6 shadow-lg transition hover:shadow-gold hover:-translate-y-0.5">
        <div class="text-3xl font-semibold text-gold-400">
          <span class="counter" data-target="{{ about.clients_number }}" data-suffix="+">0</span>
        </div>
        <div class="mt-1 text-sm uppercase tracking-wide text-gray-400">Clients</div>
      </div>

      <div class="rounded-2xl bg-navy-800 border border-gold-400/20 p-6 shadow-lg transition hover:shadow-gold hover:-translate-y-0.5">
        <div class="text-3xl font-semibold text-gold-400">
          <span class="counter" data-target="{{ about.vessels_number }}" data-suffix="+">0</span>
        </div>
        <div class="mt-1 text-sm uppercase tracking-wide text-gray-400">Vessels Available</div>
      </div>

      <div class="rounded-2xl bg-navy-800 border border-gold-400/20 p-6 shadow-lg transition hover:shadow-gold hover:-translate-y-0.5">
        <div class="text-3xl font-semibold text-gold-400">
          <span class="counter" data-target="{{ about.deals_number }}" data-suffix="+">0</span>
        </div>
        <div class="mt-1 text-sm uppercase tracking-wide text-gray-400">Closed Deals</div>
      </div>
    </div>
  </div>
</section>
